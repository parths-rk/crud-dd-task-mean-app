
services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    image: parth1111/mean-backend:latest
    ports:
      - "3000:3000"
    depends_on:
      - mongo


  frontend:
     image: parth1111/mean-frontend:latest
     ports:
       - "80:80"
     depends_on:
       - backend
volumes:
  mongo-data:
  